[package]
name = "csm"
version = "0.2.0"
edition = "2021"
description = "Claude Session Manager — a tmux-like terminal multiplexer for claude CLI sessions"

[[bin]]
name = "csm"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.28"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.8"
vt100 = "0.15"
signal-hook = "0.3"
redb = "2"
bincode = "1.3"
xattr = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
